name: Full validation

on:
  workflow_call:
    inputs:
      pack:
        type: boolean
        default: false
    outputs:
      package-sha256:
        value: ${{ jobs.ci.outputs.package-sha256 }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: WireCatLabs/cli-core/.github/workflows/node-ci.yml@4c78a803c460317fd40a38be6d1fb53278087741
    with:
      pack: ${{ inputs.pack || false }}
      pack-checks: node --experimental-strip-types scripts/release-check.ts --artifact-only
      bun-run: pnpm build && pnpm smoke:bun
      # The test matrix is rebuilt from this run's argv log, so the diff also catches a stale
      # test-matrix.md; the parity lines read the command tree from the dist/ built above.
      checks: |
        pnpm contracts:check
        pnpm contracts:upgrade
        pnpm security:no-leak
        pnpm version:check
        pnpm bot:generate:check
        pnpm exec cli-dev test-matrix --program dist/program.js --untested scripts/test-matrix-untested.ts --name tg --check
        node --experimental-strip-types scripts/commands.ts
        git diff --exit-code
        pnpm check:agent-docs
        pnpm docs:check
        pnpm parity:check

  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A warning, never a failure: bin/release takes the next free version itself (2026-09-29).
      - name: version above main and npm
        continue-on-error: true
        run: |
          pr=$(node -p 'require("./package.json").version')
          git fetch -q --depth=1 origin main
          main=$(git show FETCH_HEAD:package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          [ "$pr" != "$main" ] || exit 0
          name=$(node -p 'require("./package.json").name')
          latest=$(npm view "$name" version 2>/dev/null || true)
          floor=$(printf '%s\n%s\n' "$main" "$latest" | sort -V | tail -1)
          versions=$(npm view "$name" versions --json 2>/dev/null || true)
          next=$(node scripts/next-version.mjs "$pr" "$floor" "$versions")
          [ "$next" != "$pr" ] || exit 0
          echo "::warning file=package.json::version $pr is not above both main ($main) and npm's latest ($latest)" \
            "— bin/release will publish it as $next"

  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: install vale
        env:
          VALE_VERSION: 3.23.0
          VALE_SHA256: cc35445a45186b8f0b01e11c01359694cf941e72cf6ab0fc44774f0e54c9d5fc
        run: |
          curl -sSfLo vale.tar.gz "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  vale.tar.gz" | sha256sum -c -
          tar -xzf vale.tar.gz vale
      # Style findings are annotations until the rules are tuned; the tone rule (an error) fails.
      - run: ./vale --output line README.md docs/*.md | sed 's/^/::warning::/' || true
      - run: ./vale --minAlertLevel error README.md docs/*.md

  windows:
    uses: ./.github/workflows/windows.yml

  install_windows:
    uses: ./.github/workflows/install-windows.yml
